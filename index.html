<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Setlog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Setlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-sized app column; screen scrolls above a tab bar; editors open as full pages, pickers as bottom sheets. Single dark look by design. */
:root{
  --bg:#000; --ph:#0B0B0B; --card:#171717; --card2:#1F1F1F; --line:#2A2A2A; --ink:#F2F2F2; --mut:#8C8C8C;
  --lime:#C8F031; --lime-ink:#0A0A0A; --lime-sub:#33420A; --blue:#7CC4FF; --orange:#FF9F43; --yellow:#FFD84D; --white:#F2F2F2; --red:#FF6B6B;
  --num:'Barlow Condensed','Arial Narrow',sans-serif; --disp:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;
  display:flex;justify-content:center;align-items:center;padding-inline:16px;padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone zooms into any field under 16px when it gets focus */
input,select,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{position:relative;width:100%;max-width:420px;height:min(880px,100%);background:var(--ph);border:1px solid #232323;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){body{padding-inline:0;padding-block:0}.app{max-width:none;height:100%;border:0;border-radius:0}.screen{padding-top:calc(24px + env(safe-area-inset-top,0px))}.toast{top:calc(18px + env(safe-area-inset-top,0px))}}
.screen{flex:1;overflow-y:auto;padding:24px 20px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen > *{flex-shrink:0}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.eb{font-size:12.5px;color:var(--mut);letter-spacing:.05em}
.sub{color:var(--mut);font-size:13px}
.disp{font-family:var(--disp);font-weight:400;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;word-break:keep-all}
.n{font-family:var(--num);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-family:var(--num);font-weight:700;font-size:16px;color:var(--mut);margin-left:3px}
.pill{border:1px solid #333;background:none;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.pill.lime{border-color:var(--lime);color:var(--lime)}
.pill.solid{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:700}
.pill.ghost{color:var(--mut)}
.pill[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px 18px}
.hero{background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:16px 18px}
.hero .sub,.hero .eb{color:var(--lime-sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #333;background:none;border-radius:14px;padding:8px 14px;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.chip.sm{padding:5px 11px;font-size:12.5px;border-radius:12px}
.btn{border:0;border-radius:18px;padding:15px;text-align:center;font-weight:700;font-size:16px;width:100%}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.out{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{padding:11px;font-size:14px;border-radius:14px}
.btn.danger{background:none;border:1.5px solid var(--red);color:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1d1d1d;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));flex:none;background:var(--ph)}
.tab{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);background:none;border:0;padding:4px 0}
.tab i{width:18px;height:3px;border-radius:2px;background:#444}
.tab[aria-current="page"]{color:var(--lime)}.tab[aria-current="page"] i{background:var(--lime)}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:14px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.it:first-child{border-top:0}
.bar{width:4px;height:34px;border-radius:2px;flex:none}
.bar.plan{background:none!important;border:2px dashed;width:4px}
.t{font-weight:700}
.meta{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13.5px}
.icon{background:none;border:0;color:var(--mut);padding:4px 6px;font-size:18px;line-height:1}

/* calendar */
.cal{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dow,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--mut);padding-bottom:4px}
.dow span:first-child{color:var(--red)}
.wk{margin-top:4px}
.dc{height:56px;min-width:0;border-radius:10px;background:#141414;border:0;padding:5px 4px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;-webkit-touch-callout:none}
.dc .d{font-family:var(--num);font-weight:700;font-size:15px;color:#cfcfcf;line-height:1}
.dc.sun .d{color:var(--red)}
.dc.out{background:none}.dc.out .d{color:#3a3a3a}
.dc .b{height:6px;border-radius:3px;display:block}
.dc .b.plan{background:none!important;border:1.5px dashed}
.dc.today{box-shadow:inset 0 0 0 2px var(--lime)}
.dc.today .d{color:var(--lime)}
.dc.sel{background:#262626}
.dc .s{position:absolute;right:3px;top:3px;font-size:10px;line-height:1}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:3px;display:inline-block}
.sticky{position:sticky;bottom:-24px;margin:0 -20px -24px;padding:12px 20px 18px;background:linear-gradient(to top,var(--ph) 72%,transparent)}

/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.inp.big{font-family:var(--disp);font-size:30px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.sets{display:grid;gap:7px;align-items:center}
.sets .h{font-size:11px;color:var(--mut);text-align:center}
.sets .k{font-family:var(--num);color:var(--mut);font-size:16px;text-align:center}
.cell{background:#000;border:1px solid #2c2c2c;border-radius:12px;padding:6px 2px;text-align:center;font-family:var(--num);font-weight:800;font-size:22px;width:100%;min-width:0;color:var(--ink)}
.cell::placeholder{color:#3d3d3d}
.add{border:1px dashed #3a3a3a;background:none;border-radius:12px;padding:9px;text-align:center;color:var(--mut);font-size:13px;width:100%}
.moves{display:flex;flex-direction:column;gap:6px}
.moves div{display:flex;gap:12px;align-items:baseline}
.moves b{font-family:var(--num);font-size:20px;color:var(--lime);min-width:70px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.res label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--lime-sub);font-weight:700}
.res input{background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;font-family:var(--num);font-weight:800;font-size:40px;width:100%;min-width:0;color:var(--lime-ink)}
.res input.txt{font-family:var(--body);font-size:16px;font-weight:700;padding:12px 10px}
.res input::placeholder{color:rgba(0,0,0,.25)}
.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid #333;background:none;color:var(--ink);flex:none}
.circle[aria-pressed="true"]{background:var(--lime);color:#000;border-color:var(--lime)}
.toggle{width:48px;height:28px;border-radius:14px;background:#333;position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#888;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--lime)}
.toggle[aria-pressed="true"]::after{left:24px;background:#000}
.sq{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sq i{aspect-ratio:1;border-radius:5px;background:#262626}
.sq i.l{background:var(--lime)}.sq i.p{background:none;border:1.5px dashed #555}
.move-row{display:grid;grid-template-columns:1fr 96px 30px;gap:6px;align-items:center}

/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i,.heat button{aspect-ratio:1;border-radius:4px;background:#222;border:0;padding:0}
.heat .l{background:var(--lime)}.heat .w{background:var(--ink)}.heat .f{background:none;border:1px dashed #333}
.chart svg{width:100%;height:auto;display:block}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);border:0}
.sheet{position:relative;background:#121212;border-top:1px solid #262626;border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:#333;align-self:center}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{background:var(--card);border:0;border-radius:16px;padding:15px 16px;text-align:left;font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.menu button span{color:var(--mut);font-weight:400;font-size:13px}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--lime);color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;white-space:nowrap}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.cat-row:first-child{border-top:0}
.cat-row input{width:20px;height:20px;accent-color:var(--lime)}
</style>
</head><body>


<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button class="tab" data-tab="cal"><i></i>캘린더</button>
    <button class="tab" data-tab="wod"><i></i>와드</button>
    <button class="tab" data-tab="lib"><i></i>운동목록</button>
    <button class="tab" data-tab="stats"><i></i>돌아보기</button>
  </nav>
  <div class="sheet-wrap" id="sheetWrap" hidden>
    <button class="scrim" data-action="close-sheet" aria-label="닫기"></button>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = ['일','월','화','수','목','금','토'];
const TODAY = () => ymd(new Date());
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay()+6)%7)); };
const secToMs = s => { s = Math.round(s); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const msToSec = t => { if (!t) return NaN; const p = String(t).split(':').map(Number); return p.length === 2 ? p[0]*60+p[1] : p[0]*60; };
const round25 = x => Math.round(x/2.5)*2.5;
const e1rm = (w, r) => (w > 0 && r > 0) ? w * (1 + r/30) : 0;
const md = ds => { const d = parseYmd(ds); return `${pad(d.getMonth()+1)}.${pad(d.getDate())}`; };
const dayLabel = ds => { const d = parseYmd(ds); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };

const CATS = [
  {k:'weight', label:'웨이트', color:'var(--lime)'},
  {k:'body', label:'맨몸·홈트', color:'var(--yellow)'},
  {k:'cardio', label:'유산소', color:'var(--blue)'},
  {k:'swim', label:'수영', color:'var(--white)'},
  {k:'etc', label:'기타', color:'#777'}
];
const CAL_CATS = [...CATS.slice(0, 4), {k:'wod', label:'와드', color:'var(--orange)'}, CATS[4]];
const catOf = k => CAL_CATS.find(c => c.k === k) || CATS[4];
const FIELDS = {w:{label:'무게', unit:'kg', mode:'decimal'}, r:{label:'횟수', unit:'회', mode:'numeric'}, t:{label:'시간', unit:'', mode:'text'}, d:{label:'거리', unit:'km', mode:'decimal'}};
const MOODS = [['💪','최고'],['🙂','좋음'],['😐','보통'],['🥵','힘듦'],['🤕','부상']];
const FORMATS = {
  fortime:{label:'For Time', desc:'정해진 운동을 최대한 빨리 끝내요. 타임캡을 넘기면 완료한 렙 수를 남겨요.', res:['time','reps']},
  amrap:{label:'AMRAP', desc:'정해진 시간 안에 최대한 많은 라운드를 돌아요.', res:['rounds','reps']},
  emom:{label:'EMOM', desc:'매 분이 시작될 때 정해진 운동을 하고 남은 시간은 쉬어요.', res:['rounds']},
  deathby:{label:'Death By', desc:'1분차에 1회, 2분차에 2회처럼 매 분 1회씩 늘려요. 못 채우면 끝나요.', res:['rounds','reps']},
  igyg:{label:'I Go You Go', desc:'파트너와 한 명씩 번갈아 수행해요.', res:['time','partner']},
  tabata:{label:'Tabata', desc:'20초 운동, 10초 휴식을 8라운드 반복해요.', res:['reps']},
  custom:{label:'직접 입력', desc:'정해진 방식이 없을 때 자유롭게 적어요.', res:['text']}
};
const resLabel = (f, k) => f === 'deathby' && k === 'rounds' ? '완료한 분' : f === 'emom' && k === 'rounds' ? '완료 라운드' : f === 'tabata' && k === 'reps' ? '총 렙' : f === 'fortime' && k === 'reps' ? '타임캡 시 렙' : f === 'deathby' && k === 'reps' ? '추가 렙' : ({time:'완료 시간', rounds:'라운드', reps:'추가 렙', partner:'파트너', text:'결과'})[k];

/* ---------- seed data (examples) ---------- */
function seedExercises() {
  const W = ['w','r'], B = ['r'], C = ['d','t'];
  return [
    ['sq','백스쿼트','weight',W],['bp','벤치프레스','weight',W],['dl','데드리프트','weight',W],['ohp','오버헤드프레스','weight',W],
    ['row','바벨로우','weight',W],['thr','스러스터','weight',W],['cj','클린앤저크','weight',W],['sn','스내치','weight',W],['kbs','케틀벨 스윙','weight',W],
    ['pu','풀업','body',B],['push','푸시업','body',B],['air','에어스쿼트','body',B],['situp','싯업','body',B],['burpee','버피','body',B],['du','더블언더','body',B],['hspu','핸드스탠드 푸시업','body',B],['t2b','토투바','body',B],['mu','머슬업','body',B],['box','박스점프','body',B],['wb','월볼','weight',W],['plank','플랭크','body',['t']],
    ['run','러닝','cardio',C,'km'],['rowerg','로잉머신','cardio',C,'m'],['bike','사이클','cardio',C,'km'],['ski','스키에르그','cardio',C,'m'],
    ['free','자유형','swim',C,'m'],['breast','평영','swim',C,'m']
  ].map(([id,name,cat,fields,unit]) => ({id, name, cat, fields:[...fields], unit:unit || 'km'}));
}
const NAMED = [
  {id:'fran', name:'Fran', format:'fortime', scheme:'21-15-9', moves:[['21-15-9','스러스터 43/29kg'],['21-15-9','풀업']]},
  {id:'grace', name:'Grace', format:'fortime', moves:[['30회','클린앤저크 61/43kg']]},
  {id:'cindy', name:'Cindy', format:'amrap', cap:20, moves:[['5회','풀업'],['10회','푸시업'],['15회','에어스쿼트']]},
  {id:'murph', name:'Murph', format:'fortime', moves:[['1.6km','러닝'],['100회','풀업'],['200회','푸시업'],['300회','에어스쿼트'],['1.6km','러닝']], note:'9kg 조끼 착용 (Rx)'},
  {id:'helen', name:'Helen', format:'fortime', rounds:3, moves:[['400m','러닝'],['21회','케틀벨 스윙 24/16kg'],['12회','풀업']]},
  {id:'annie', name:'Annie', format:'fortime', scheme:'50-40-30-20-10', moves:[['50→10','더블언더'],['50→10','싯업']]},
  {id:'karen', name:'Karen', format:'fortime', moves:[['150회','월볼 9/6kg']]},
  {id:'diane', name:'Diane', format:'fortime', scheme:'21-15-9', moves:[['21-15-9','데드리프트 102/70kg'],['21-15-9','핸드스탠드 푸시업']]},
  {id:'isabel', name:'Isabel', format:'fortime', moves:[['30회','스내치 61/43kg']]},
  {id:'jackie', name:'Jackie', format:'fortime', moves:[['1000m','로잉'],['50회','스러스터 20/15kg'],['30회','풀업']]},
  {id:'dt', name:'DT', format:'fortime', rounds:5, moves:[['12회','데드리프트 70/47kg'],['9회','행 파워클린'],['6회','푸시저크']]}
].map(w => ({...w, named:true, moves:w.moves.map(([a,n]) => ({a, n}))}));
const seedMine = () => [
  {id:'m1', name:'월요일 파트너 와드', format:'igyg', cap:24, rounds:10, moves:[{a:'10회',n:'버피'},{a:'15cal',n:'로잉'}], note:'박스 수업에서 받은 와드'},
  {id:'m2', name:'버피 Death By', format:'deathby', moves:[{a:'매 분 +1',n:'버피'}]}
];
function seedSessions() {

/* exercise history */
function hits(id, name) {
  const out = [], q = norm(name);
  for (const s of [...state.sessions].sort((a, b) => b.date.localeCompare(a.date))) for (const it of s.items) {
    if (it.type === 'ex') { const ex = exById(it.exId);
      if ((id && it.exId === id) || (!id && q && ex && norm(ex.name).includes(q))) out.push({s, kind:'ex', head:ex?.name || '', detail:setsText(it, ex || {unit:'km'}) + (it.fields.includes('w') ? ' kg' : '')}); }
    else { const ms = (it.moves || []).filter(m => id ? (m.exId === id || (!m.exId && q && norm(m.n).includes(q))) : (q && norm(m.n).includes(q)));
      if (ms.length) out.push({s, kind:'wod', head:`${it.name}${wodResult(it) ? ' · ' + wodResult(it) : ''}`, detail:ms.map(m => [m.a, m.n].filter(Boolean).join(' ')).join(', ')}); }
  }
  return out;
}
const hitRow = h => `<button class="it" data-action="open-day" data-date="${h.s.date}"><span class="bar" style="background:${h.kind === 'wod' ? 'var(--orange)' : catOf(sessionCat(h.s)).color};height:30px"></span><span class="grow"><span class="t" style="display:block">${esc(h.head)}</span><span class="meta" style="display:block">${esc(h.detail)}</span></span><span class="n" style="font-size:20px;color:var(--mut)">${md(h.s.date)}</span></button>`;

  ui.sheet = () => sheetExHistory(id);
  const ex = exById(id); if (!ex) return closeSheet();
  const hs = hits(id, ex.name), pts = series(id), best = pts.length ? Math.max(...pts.map(p => p.v)) : 0;
  openSheet(`<div class="row between" style="align-items:flex-end"><h2 class="disp" style="font-size:36px">${esc(ex.name)}</h2><button class="pill" data-action="edit-ex" data-id="${id}">편집</button></div>
    <div class="row wrap" style="gap:6px"><span class="pill lime">기록 ${hs.length}번</span><span class="pill">${catOf(ex.cat).label}</span>${hs[0] ? `<span class="pill">마지막 ${md(hs[0].s.date)}</span>` : ''}${best ? `<span class="pill">예상 1RM 최고 ${best}kg</span>` : ''}</div>
    ${hs.length ? `<div class="card list" style="padding:2px 16px">${hs.map(hitRow).join('')}</div>` : '<div class="empty">아직 이 운동을 기록한 날이 없어요.</div>'}`);
}

    <div class="sub" style="font-weight:500">최근 4주 계획 지킴 ${keep.rate}% · ${keep.due - keep.kept ? `놓친 계획 ${keep.due - keep.kept}개` : '놓친 계획 없음'}</div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">

    <div class="sub" style="font-size:11.5px">그날 가장 좋은 세트로 계산해요 (무게 × (1 + 횟수 ÷ 30))</div></div>

    <button class="btn out small" data-action="wipe">${ui.confirm === 'wipe' ? '한 번 더 누르면 예시를 지우고 빈 상태로 시작해요' : '예시 지우고 내 기록으로 시작'}</button>

}
function chartSvg(pts) {
  const W = 340, H = 170, L = 30, R = 40, T = 12, B = 22, vs = pts.map(p => p.v);
  let lo = Math.floor((Math.min(...vs) - 2) / 10) * 10, hi = Math.ceil((Math.max(...vs) + 2) / 10) * 10;
  const step = hi - lo <= 40 ? 10 : 20;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length-1].date).getTime();
  const x = d => L + (parseYmd(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = ''; for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" fill="#8C8C8C" font-size="10">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(''), lp = pts[pts.length-1];
  const lab = [pts[0], pts[Math.floor(pts.length/2)], lp].map((p, i) => `<text x="${x(p.date)}" y="${H-5}" text-anchor="${['start','middle','end'][i]}" fill="#8C8C8C" font-size="10">${md(p.date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="예상 1RM ${pts[0].v}kg에서 ${lp.v}kg">${g}<path d="${line}L${x(lp.date)},${H-B}L${L},${H-B}Z" fill="#C8F031" opacity=".12"/><path d="${line}" fill="none" stroke="#C8F031" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(lp.date)}" cy="${y(lp.v)}" r="5" fill="#C8F031"/><text x="${x(lp.date)+8}" y="${y(lp.v)+4}" fill="#F2F2F2" font-size="13" font-weight="700">${lp.v}</text>${lab}</svg>`;
}
