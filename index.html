<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Setlog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Setlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-sized app column; screen scrolls above a tab bar; editors open as full pages, pickers as bottom sheets. Single dark look by design. */
:root{
  --bg:#000; --ph:#0B0B0B; --card:#171717; --card2:#1F1F1F; --line:#2A2A2A; --ink:#F2F2F2; --mut:#8C8C8C;
  --lime:#C8F031; --lime-ink:#0A0A0A; --lime-sub:#33420A; --blue:#7CC4FF; --orange:#FF9F43; --yellow:#FFD84D; --white:#F2F2F2; --red:#FF6B6B;
  --num:'Barlow Condensed','Arial Narrow',sans-serif; --disp:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;
  display:flex;justify-content:center;align-items:center;padding-inline:16px;padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone zooms into any field under 16px when it gets focus */
input,select,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{position:relative;width:100%;max-width:420px;height:min(880px,100%);background:var(--ph);border:1px solid #232323;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){body{padding-inline:0;padding-block:0}.app{max-width:none;height:100%;border:0;border-radius:0}.screen{padding-top:calc(24px + env(safe-area-inset-top,0px))}.toast{top:calc(18px + env(safe-area-inset-top,0px))}}
.screen{flex:1;overflow-y:auto;padding:24px 20px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen > *{flex-shrink:0}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.eb{font-size:12.5px;color:var(--mut);letter-spacing:.05em}
.sub{color:var(--mut);font-size:13px}
.disp{font-family:var(--disp);font-weight:400;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;word-break:keep-all}
.n{font-family:var(--num);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-family:var(--num);font-weight:700;font-size:16px;color:var(--mut);margin-left:3px}
.pill{border:1px solid #333;background:none;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.pill.lime{border-color:var(--lime);color:var(--lime)}
.pill.solid{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:700}
.pill.ghost{color:var(--mut)}
.pill[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px 18px}
.hero{background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:16px 18px}
.hero .sub,.hero .eb{color:var(--lime-sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #333;background:none;border-radius:14px;padding:8px 14px;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.chip.sm{padding:5px 11px;font-size:12.5px;border-radius:12px}
.btn{border:0;border-radius:18px;padding:15px;text-align:center;font-weight:700;font-size:16px;width:100%}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.out{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{padding:11px;font-size:14px;border-radius:14px}
.btn.danger{background:none;border:1.5px solid var(--red);color:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1d1d1d;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));flex:none;background:var(--ph)}
.tab{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);background:none;border:0;padding:4px 0}
.tab i{width:18px;height:3px;border-radius:2px;background:#444}
.tab[aria-current="page"]{color:var(--lime)}.tab[aria-current="page"] i{background:var(--lime)}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:14px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.it:first-child{border-top:0}
.bar{width:4px;height:34px;border-radius:2px;flex:none}
.bar.plan{background:none!important;border:2px dashed;width:4px}
.t{font-weight:700}
.meta{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13.5px}
.icon{background:none;border:0;color:var(--mut);padding:4px 6px;font-size:18px;line-height:1}

/* calendar */
.cal{touch-action:pan-y;user-select:none;-webkit-user-select:none}
/* long press anywhere: no text selection, no link/image preview; typing fields and the SNS previews (long press = save photo) keep theirs */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.snsprev img{-webkit-touch-callout:default}
img{-webkit-user-drag:none}
.dow,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--mut);padding-bottom:4px}
.dow span:first-child{color:var(--red)}
.wk{margin-top:4px}
.cal.wvol .dow,.cal.wvol .wk{grid-template-columns:repeat(7,minmax(0,1fr)) 36px}
.wk .wv{align-self:center;text-align:right;font-family:var(--num);font-weight:700;font-size:12.5px;color:var(--ink);white-space:nowrap}
.wk .wv small{display:block;font-family:var(--body);font-weight:500;font-size:9.5px;color:var(--mut);margin-top:1px}
.evol{display:flex;align-items:baseline;flex-shrink:0}.evol .n{font-size:22px}
.dow .wv{text-align:right;font-size:10px}
.dc{height:62px;min-width:0;border-radius:10px;background:#141414;border:0;padding:5px 4px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;-webkit-touch-callout:none}
.dc .d{font-family:var(--num);font-weight:700;font-size:15px;color:#cfcfcf;line-height:1}
.dc.sun .d{color:var(--red)}
.dc.out{background:none}.dc.out .d{color:#3a3a3a}
.dc .bs{display:flex;flex-direction:column;gap:2px}
.dc .b{height:5px;border-radius:3px;display:block}
.dc .more{font-family:var(--num);font-weight:700;font-size:10px;line-height:1;color:var(--mut)}
.dc .b.plan{background:none!important;border:1.5px dashed}
.dc.today{box-shadow:inset 0 0 0 2px var(--lime)}
.dc.today .d{color:var(--lime)}
.dc.sel{background:#262626}
.dc .s{position:absolute;right:3px;top:3px;font-size:10px;line-height:1}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:3px;display:inline-block}
.sticky{position:sticky;bottom:-24px;margin:0 -20px -24px;padding:12px 20px 18px;background:linear-gradient(to top,var(--ph) 72%,transparent)}

/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.field.grow{flex:1 1 0;min-width:0}
/* iOS gives date fields a wide built-in size; let them shrink to the column */
input.inp[type=date]{-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;height:46px;text-align:left}
input.inp[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
.inp.big{font-family:var(--disp);font-size:30px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.sets{display:grid;gap:7px;align-items:center}
.sets .h{font-size:11px;color:var(--mut);text-align:center}
.sets .k{font-family:var(--num);color:var(--mut);font-size:16px;text-align:center}
.cell{background:#000;border:1px solid #2c2c2c;border-radius:12px;padding:6px 2px;text-align:center;font-family:var(--num);font-weight:800;font-size:22px;width:100%;min-width:0;color:var(--ink)}
.cell::placeholder{color:#3d3d3d}
.add{border:1px dashed #3a3a3a;background:none;border-radius:12px;padding:9px;text-align:center;color:var(--mut);font-size:13px;width:100%}
.moves{display:flex;flex-direction:column;gap:6px}
.moves div{display:flex;gap:12px;align-items:baseline}
.moves b{font-family:var(--num);font-size:20px;color:var(--lime);min-width:70px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.res label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--lime-sub);font-weight:700}
.res input{background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;font-family:var(--num);font-weight:800;font-size:40px;width:100%;min-width:0;color:var(--lime-ink)}
.res input.txt{font-family:var(--body);font-size:16px;font-weight:700;padding:12px 10px}
.res input::placeholder{color:rgba(0,0,0,.25)}
.circle{width:38px;height:38px;max-width:calc((100vw - 120px) / 7);max-height:calc((100vw - 120px) / 7);min-width:30px;min-height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid #333;background:none;color:var(--ink);flex:none}
.circle[aria-pressed="true"]{background:var(--lime);color:#000;border-color:var(--lime)}
.toggle{width:48px;height:28px;border-radius:14px;background:#333;position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#888;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--lime)}
.toggle[aria-pressed="true"]::after{left:24px;background:#000}
.sq{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sq i{aspect-ratio:1;border-radius:5px;background:#262626}
.sq i.l{background:var(--lime)}.sq i.p{background:none;border:1.5px dashed #555}
.move-row{display:grid;grid-template-columns:1fr 96px 30px;gap:6px;align-items:center}

/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i,.heat button{aspect-ratio:1;border-radius:4px;background:#222;border:0;padding:0;display:grid;place-items:center;font-size:10px;font-weight:700;font-style:normal;line-height:1;color:#5c5c5c}
.heat .sun{color:#a55}
.heat .today{outline:2px solid var(--lime);outline-offset:1px}
.heat .cur{position:relative}
.hlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px;font-size:10px;color:var(--mut);white-space:nowrap}
.hlab span:last-child{color:var(--lime);font-weight:700;text-align:right;grid-column:11 / 13}
.heat .h1{background:color-mix(in srgb,var(--lime) 35%,#222);color:#ddd}.heat .h2{background:color-mix(in srgb,var(--lime) 65%,#222);color:#000}.heat .h3{background:var(--lime);color:#000}
.hkey{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:8px;font-size:10px;color:var(--mut)}.hkey i{width:12px;height:12px;border-radius:3px;background:#222}.hkey .h1{background:color-mix(in srgb,var(--lime) 35%,#222)}.hkey .h2{background:color-mix(in srgb,var(--lime) 65%,#222)}.hkey .h3{background:var(--lime)}.heat .f{background:none;border:1px dashed #333;color:#3a3a3a}
.chart svg{width:100%;height:auto;display:block}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);border:0}
.sheet{position:relative;background:#121212;border-top:1px solid #262626;border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:#333;align-self:center}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{background:var(--card);border:0;border-radius:16px;padding:15px 16px;text-align:left;font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.menu button span{color:var(--mut);font-weight:400;font-size:13px}
.guide{position:absolute;inset:0;overflow:hidden;z-index:40;background:#000;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px))}
.guide .gtop{flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 20px 10px}
.guide .gtrack{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.guide .gtrack::-webkit-scrollbar{display:none}
.guide .gs{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 24px;min-height:0;height:100%;box-sizing:border-box}
.guide .gs .shot{flex:1 1 0;min-height:0;width:100%;position:relative}
.guide .gs img{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:100%;max-height:100%;border-radius:22px;border:1px solid #2a2a2a;object-fit:contain}
.guide .gs h2{flex:none;font-size:28px;text-align:center;margin:0}
.guide .gs p{color:var(--mut);font-size:14px;text-align:center;line-height:1.5;margin:0;max-width:320px;flex:none}
.guide .gdots{flex:none;display:flex;justify-content:center;gap:6px;padding:12px 0}
.guide .gdots i{width:7px;height:7px;border-radius:9px;background:#333}
.guide .gdots i.on{background:var(--lime);width:20px}
.guide .gbtn{flex:none;margin:0 20px;width:auto;box-sizing:border-box}
.vchart{display:flex;align-items:flex-end;gap:6px;height:140px}
.vchart button{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;background:none;border:0;padding:0}
.vchart .b{width:100%;border-radius:6px 6px 3px 3px;background:#3a3a3a}
.vchart .on .b{background:var(--lime)}
.vchart .l{font-size:10.5px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.vchart .on .l{color:var(--lime);font-weight:700}
.vchart .v{font-family:var(--num);font-weight:700;font-size:13px}
.chk{width:28px;height:28px;border-radius:8px;border:1.5px solid #444;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#000;flex-shrink:0}
.chk.on{background:var(--lime);border-color:var(--lime)}
.snsprev{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.snsprev img{width:70%;max-width:260px;flex-shrink:0;border-radius:12px;border:1px solid #2a2a2a}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;height:76px}
.calhead h1{line-height:1}
.calhead .viewsw{flex-shrink:0;margin-left:auto}
.vline{display:flex;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.vline.lime{border-top-color:rgba(0,0,0,.15)}.vline.lime .eb,.vline.lime .unit{color:var(--lime-sub)}
.card.list .vline{padding:12px 0 10px;margin-top:0}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.vrow .vtrack{flex:0 0 80px;height:8px;border-radius:4px;background:#262626;overflow:hidden;display:flex}
.vrow .n{font-size:18px;min-width:56px;text-align:right}
.vbtn{border:1.5px solid var(--lime-ink);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;background:none;color:var(--lime-ink)}
.vbtn.on{background:var(--lime-ink);color:var(--lime)}
.cvol{border-top:1px solid rgba(0,0,0,.15);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.cvol .li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid rgba(0,0,0,.12);font-weight:500}
.cvol .li:first-child{border-top:0}
.wsum{font-weight:500;line-height:1.55;padding:10px 0;border-top:1px solid rgba(0,0,0,.15);border-bottom:1px solid rgba(0,0,0,.15)}
.wsum .sh{font-weight:800;margin-top:6px}
.wsum .sh:first-child{margin-top:0}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0;outline:2px solid transparent;outline-offset:2px}
.swatch[aria-pressed="true"]{outline-color:var(--ink)}
.btnrow>.btn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;padding-right:8px}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.smv{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px dashed #2e2e2e}
.cfg{display:flex;align-items:center;gap:8px;padding:6px 0 6px 10px;border-left:3px solid var(--lime);margin:4px 0}
.cfg .c2{pointer-events:none}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--lime);color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;white-space:nowrap}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.cat-row:first-child{border-top:0}
.cat-row input{width:20px;height:20px;accent-color:var(--lime)}
/* kg / lb switch */
.unitsw{display:inline-flex;border:1px solid #333;border-radius:99px;padding:2px}
.unitsw button{background:none;border:0;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.unitsw button[aria-pressed="true"]{background:var(--lime);color:#000}
/* pattern number field: "Team of [3]" */
.patv{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--lime)}
.patv input{width:110px;background:#000;border:1px solid var(--lime);border-radius:10px;padding:7px 10px;font-family:var(--num);font-weight:800;font-size:20px;color:var(--ink)}
.c2.sm{font-size:13px;padding:4px 10px}
/* WOD card: frame (format + pattern chips) then exercise rows */
.wc{display:flex;flex-direction:column;gap:10px}
.part{display:flex;flex-direction:column;gap:8px}
.part + .part{margin-top:22px;padding-top:22px;border-top:3px solid #5a5a5a}
.lbl{font-size:12px;color:var(--mut);font-weight:700}
.frame{background:#000;border:1px solid #2c2c2c;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.c2{font-size:14px;border:1px solid #333;border-radius:99px;padding:6px 12px;font-weight:600;background:none;color:var(--ink);display:inline-flex;align-items:center}
.c2.on{background:var(--lime);border-color:var(--lime);color:#000}
.c2.val{border-color:var(--lime);color:var(--lime)}
.c2.add{border-style:dashed;color:var(--lime);border-color:var(--lime)}

function chartSvg(pts) {
  const W = 340, H = 170, L = 30, R = 40, T = 12, B = 22, vs = pts.map(p => p.v);
  let lo = Math.floor((Math.min(...vs) - 2) / 10) * 10, hi = Math.ceil((Math.max(...vs) + 2) / 10) * 10;
  const step = hi - lo <= 40 ? 10 : 20;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length-1].date).getTime();
  const x = d => L + (parseYmd(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = ''; for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" fill="#8C8C8C" font-size="10">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(''), lp = pts[pts.length-1];
  const lab = [pts[0], pts[Math.floor(pts.length/2)], lp].map((p, i) => `<text x="${x(p.date)}" y="${H-5}" text-anchor="${['start','middle','end'][i]}" fill="#8C8C8C" font-size="10">${md(p.date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="예상 1RM ${pts[0].v}${U()}에서 ${lp.v}${U()}">${g}<path d="${line}L${x(lp.date)},${H-B}L${L},${H-B}Z" fill="${accent()}" opacity=".12"/><path d="${line}" fill="none" stroke="${accent()}" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(lp.date)}" cy="${y(lp.v)}" r="5" fill="${accent()}"/><text x="${x(lp.date)+8}" y="${y(lp.v)+4}" fill="#F2F2F2" font-size="13" font-weight="700">${lp.v}</text>${lab}</svg>`;
}

  const exact = list.some(e => exIs(e, q));
  box.innerHTML = list.map(e => `<button data-action="mv-pick" data-i="${ds.i}" data-pi="${ds.pi}" data-j="${ds.mv}" data-id="${e.id}"><b>${esc(e.name)}</b><small>${u[e.id] ? `${u[e.id]}번` : ''}</small></button>`).join('')
    + (exact ? '' : `<button data-action="mv-new" data-i="${ds.i}" data-pi="${ds.pi}" data-j="${ds.mv}" style="color:var(--lime)">+ "${esc(input.value.trim())}" 새 운동으로</button>`);
}
document.addEventListener('input', e => { const ds = e.target.dataset, i = ds.i ?? ds.wn; if (i !== undefined && ['edit', 'tpl'].includes(ui.page)) updateSum(i); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

/* ---------- no zooming: block pinch (iOS ignores user-scalable=no); double-tap zoom is off via touch-action ---------- */
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* ---------- edge swipe back: drag from the left edge to the right, like iPhone Safari ---------- */
const EDGE = 28;
function goBack() {
  if (!$('#sheetWrap').hidden) { closeSheet(); return; }
  if (ui.page === 'edit') { const was = ui.confirm; A['cancel-edit'](); if (ui.page === 'edit' && ui.confirm === 'cancel' && was !== 'cancel') toast('한 번 더 밀면 작성 중인 내용을 버려요'); return; }
  if (ui.page === 'tpl') A['tpl-cancel'](); else if (ui.page) A['close-page']();
}
let edge = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0], left = $('#app').getBoundingClientRect().left;
  edge = (e.touches.length === 1 && $('#guide').hidden && t.clientX - left < EDGE && (ui.page || !$('#sheetWrap').hidden)) ? {x:t.clientX, y:t.clientY, t:Date.now(), on:false, el:!$('#sheetWrap').hidden ? $('#sheet') : $('#screen')} : null;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!edge) return;
  const t = e.touches[0], dx = t.clientX - edge.x, dy = t.clientY - edge.y;
  if (!edge.on) { if (Math.abs(dy) > 10 && Math.abs(dy) > dx) { edge = null; return; } if (dx < 8) return; edge.on = true; edge.el.style.transition = 'none'; edge.el.style.boxShadow = '-12px 0 24px rgba(0,0,0,.6)'; document.activeElement?.blur?.(); }
  e.preventDefault();
  edge.dx = Math.max(0, dx); edge.el.style.transform = `translateX(${edge.dx}px)`;
}, {passive:false});
function endEdge() {
  if (!edge) return; const g = edge; edge = null; if (!g.on) return;
  swallowClick = true; setTimeout(() => swallowClick = false, 350);
  const w = $('#app').clientWidth, go = g.dx > w * 0.33 || (g.dx > 40 && g.dx / (Date.now() - g.t) > 0.5);
  g.el.style.transition = 'transform .18s ease-out'; g.el.style.transform = `translateX(${go ? w : 0}px)`;
  setTimeout(() => { g.el.style.transition = g.el.style.transform = g.el.style.boxShadow = ''; if (go) goBack(); }, 190);
}
document.addEventListener('touchend', endEdge);
document.addEventListener('touchcancel', endEdge);

applyTheme();
render();
try { if (!localStorage.getItem(GUIDE_KEY) && !/[?&]noguide/.test(location.search)) showGuide(); } catch (e) {}
</script>
