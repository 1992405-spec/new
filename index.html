<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Setlog">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Setlog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-sized app column; screen scrolls above a tab bar; editors open as full pages, pickers as bottom sheets. Single dark look by design. */
:root{
  --bg:#000; --ph:#0B0B0B; --card:#171717; --card2:#1F1F1F; --line:#2A2A2A; --ink:#F2F2F2; --mut:#8C8C8C;
  --lime:#C8F031; --lime-ink:#0A0A0A; --lime-sub:#33420A; --blue:#7CC4FF; --orange:#FF9F43; --yellow:#FFD84D; --white:#F2F2F2; --red:#FF6B6B;
  --num:'Barlow Condensed','Arial Narrow',sans-serif; --disp:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;height:100dvh}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;margin:0;
  display:flex;justify-content:center;align-items:center;padding-inline:16px;padding-block:16px}
button,input,select,textarea{font:inherit;color:inherit}
/* iPhone zooms into any field under 16px when it gets focus */
input,select,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{position:relative;width:100%;max-width:420px;height:min(880px,100%);background:var(--ph);border:1px solid #232323;border-radius:40px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){body{padding-inline:0;padding-block:0}.app{max-width:none;height:100%;border:0;border-radius:0}.screen{padding-top:calc(24px + env(safe-area-inset-top,0px))}.toast{top:calc(18px + env(safe-area-inset-top,0px))}}
.screen{flex:1;overflow-y:auto;padding:24px 20px 24px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.screen > *{flex-shrink:0}
.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.eb{font-size:12.5px;color:var(--mut);letter-spacing:.05em}
.sub{color:var(--mut);font-size:13px}
.disp{font-family:var(--disp);font-weight:400;line-height:1.05;letter-spacing:-.01em;margin:0;text-wrap:balance;word-break:keep-all}
.n{font-family:var(--num);font-weight:800;line-height:.9;font-variant-numeric:tabular-nums}
.unit{font-family:var(--num);font-weight:700;font-size:16px;color:var(--mut);margin-left:3px}
.pill{border:1px solid #333;background:none;border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.pill.lime{border-color:var(--lime);color:var(--lime)}
.pill.solid{background:var(--lime);color:var(--lime-ink);border-color:var(--lime);font-weight:700}
.pill.ghost{color:var(--mut)}
.pill[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px 18px}
.hero{background:var(--lime);color:var(--lime-ink);border-radius:24px;padding:16px 18px}
.hero .sub,.hero .eb{color:var(--lime-sub)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #333;background:none;border-radius:14px;padding:8px 14px;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.chip.sm{padding:5px 11px;font-size:12.5px;border-radius:12px}
.btn{border:0;border-radius:18px;padding:15px;text-align:center;font-weight:700;font-size:16px;width:100%}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.out{background:none;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{padding:11px;font-size:14px;border-radius:14px}
.btn.danger{background:none;border:1.5px solid var(--red);color:var(--red)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1d1d1d;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));flex:none;background:var(--ph)}
.tab{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:var(--mut);background:none;border:0;padding:4px 0}
.tab i{width:18px;height:3px;border-radius:2px;background:#444}
.tab[aria-current="page"]{color:var(--lime)}.tab[aria-current="page"] i{background:var(--lime)}
.list{display:flex;flex-direction:column}
.it{display:flex;gap:14px;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:var(--ink)}
.it:first-child{border-top:0}
.bar{width:4px;height:34px;border-radius:2px;flex:none}
.bar.plan{background:none!important;border:2px dashed;width:4px}
.t{font-weight:700}
.meta{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:18px 8px;font-size:13.5px}
.icon{background:none;border:0;color:var(--mut);padding:4px 6px;font-size:18px;line-height:1}

/* calendar */
.cal{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.dow,.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow span{text-align:center;font-size:11px;color:var(--mut);padding-bottom:4px}
.dow span:first-child{color:var(--red)}
.wk{margin-top:4px}
.dc{height:56px;min-width:0;border-radius:10px;background:#141414;border:0;padding:5px 4px;display:flex;flex-direction:column;gap:3px;position:relative;text-align:left;-webkit-touch-callout:none}
.dc .d{font-family:var(--num);font-weight:700;font-size:15px;color:#cfcfcf;line-height:1}
.dc.sun .d{color:var(--red)}
.dc.out{background:none}.dc.out .d{color:#3a3a3a}
.dc .b{height:6px;border-radius:3px;display:block}
.dc .b.plan{background:none!important;border:1.5px dashed}
.dc.today{box-shadow:inset 0 0 0 2px var(--lime)}
.dc.today .d{color:var(--lime)}
.dc.sel{background:#262626}
.dc .s{position:absolute;right:3px;top:3px;font-size:10px;line-height:1}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:3px;display:inline-block}
.sticky{position:sticky;bottom:-24px;margin:0 -20px -24px;padding:12px 20px 18px;background:linear-gradient(to top,var(--ph) 72%,transparent)}

/* editor */
.field{display:flex;flex-direction:column;gap:6px}
.inp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.inp.big{font-family:var(--disp);font-size:30px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:4px 0}
textarea.inp{resize:vertical;min-height:70px;line-height:1.6}
.sets{display:grid;gap:7px;align-items:center}
.sets .h{font-size:11px;color:var(--mut);text-align:center}
.sets .k{font-family:var(--num);color:var(--mut);font-size:16px;text-align:center}
.cell{background:#000;border:1px solid #2c2c2c;border-radius:12px;padding:6px 2px;text-align:center;font-family:var(--num);font-weight:800;font-size:22px;width:100%;min-width:0;color:var(--ink)}
.cell::placeholder{color:#3d3d3d}
.add{border:1px dashed #3a3a3a;background:none;border-radius:12px;padding:9px;text-align:center;color:var(--mut);font-size:13px;width:100%}
.moves{display:flex;flex-direction:column;gap:6px}
.moves div{display:flex;gap:12px;align-items:baseline}
.moves b{font-family:var(--num);font-size:20px;color:var(--lime);min-width:70px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.res label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--lime-sub);font-weight:700}
.res input{background:rgba(0,0,0,.08);border:1.5px solid rgba(0,0,0,.25);border-radius:14px;padding:6px 10px;font-family:var(--num);font-weight:800;font-size:40px;width:100%;min-width:0;color:var(--lime-ink)}
.res input.txt{font-family:var(--body);font-size:16px;font-weight:700;padding:12px 10px}
.res input::placeholder{color:rgba(0,0,0,.25)}
.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid #333;background:none;color:var(--ink);flex:none}
.circle[aria-pressed="true"]{background:var(--lime);color:#000;border-color:var(--lime)}
.toggle{width:48px;height:28px;border-radius:14px;background:#333;position:relative;border:0;flex:none}
.toggle::after{content:"";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#888;transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--lime)}
.toggle[aria-pressed="true"]::after{left:24px;background:#000}
.sq{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sq i{aspect-ratio:1;border-radius:5px;background:#262626}
.sq i.l{background:var(--lime)}.sq i.p{background:none;border:1.5px dashed #555}
.move-row{display:grid;grid-template-columns:1fr 96px 30px;gap:6px;align-items:center}

/* stats */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i,.heat button{aspect-ratio:1;border-radius:4px;background:#222;border:0;padding:0}
.heat .l{background:var(--lime)}.heat .w{background:var(--ink)}.heat .f{background:none;border:1px dashed #333}
.chart svg{width:100%;height:auto;display:block}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);border:0}
.sheet{position:relative;background:#121212;border-top:1px solid #262626;border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:#333;align-self:center}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.menu{display:flex;flex-direction:column;gap:8px}
.menu button{background:var(--card);border:0;border-radius:16px;padding:15px 16px;text-align:left;font-size:15px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.menu button span{color:var(--mut);font-weight:400;font-size:13px}
.guide{position:absolute;inset:0;overflow:hidden;z-index:40;background:#000;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px))}
.guide .gtop{flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 20px 10px}
.guide .gtrack{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.guide .gtrack::-webkit-scrollbar{display:none}
.guide .gs{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 24px;min-height:0;height:100%;box-sizing:border-box}
.guide .gs .shot{flex:1 1 0;min-height:0;width:100%;position:relative}
.guide .gs img{position:absolute;inset:0;margin:auto;width:auto;height:auto;max-width:100%;max-height:100%;border-radius:22px;border:1px solid #2a2a2a;object-fit:contain}
.guide .gs h2{flex:none;font-size:28px;text-align:center;margin:0}
.guide .gs p{color:var(--mut);font-size:14px;text-align:center;line-height:1.5;margin:0;max-width:320px;flex:none}
.guide .gdots{flex:none;display:flex;justify-content:center;gap:6px;padding:12px 0}
.guide .gdots i{width:7px;height:7px;border-radius:9px;background:#333}
.guide .gdots i.on{background:var(--lime);width:20px}
.guide .gbtn{flex:none;margin:0 20px;width:auto;box-sizing:border-box}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--lime);color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:30;white-space:nowrap}
.search{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
.cat-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.cat-row:first-child{border-top:0}
.cat-row input{width:20px;height:20px;accent-color:var(--lime)}
/* kg / lb switch */
.unitsw{display:inline-flex;border:1px solid #333;border-radius:99px;padding:2px}
.unitsw button{background:none;border:0;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.unitsw button[aria-pressed="true"]{background:var(--lime);color:#000}
/* pattern number field: "Team of [3]" */
.patv{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--lime)}
.patv input{width:110px;background:#000;border:1px solid var(--lime);border-radius:10px;padding:7px 10px;font-family:var(--num);font-weight:800;font-size:20px;color:var(--ink)}
.c2.sm{font-size:13px;padding:4px 10px}
/* WOD card: frame (format + pattern chips) then exercise rows */
.wc{display:flex;flex-direction:column;gap:10px}
.part{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;color:var(--mut);font-weight:700}
.frame{background:#000;border:1px solid #2c2c2c;border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.chips2{display:flex;gap:6px;flex-wrap:wrap}
.c2{font-size:14px;border:1px solid #333;border-radius:99px;padding:6px 12px;font-weight:600;background:none;color:var(--ink);display:inline-flex;align-items:center}
.c2.on{background:var(--lime);border-color:var(--lime);color:#000}
.c2.val{border-color:var(--lime);color:var(--lime)}
.c2.add{border-style:dashed;color:var(--lime);border-color:var(--lime)}
.c2 .x{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#333;color:var(--ink);font-size:11px;margin-left:6px}
.fdiv{display:flex;align-items:center;gap:6px;background:#000;border:1px solid #2c2c2c;border-left:4px solid var(--lime);border-radius:12px;padding:6px 6px 6px 10px}
.fdiv .c2{padding:4px 10px;font-size:13px}
.fdiv .t{font-size:12px;color:var(--mut);font-weight:700}
.mv{display:grid;grid-template-columns:64px minmax(0,1fr) 70px 26px;gap:6px;align-items:center}
.mv input{background:#000;border:1px solid #2c2c2c;border-radius:12px;padding:9px 8px;font-size:16px;width:100%;min-width:0;color:var(--ink)}
.mv input.q{font-family:var(--num);font-weight:700;font-size:18px;text-align:center;padding:7px 4px}
.mv input.q::placeholder{color:#777}
.mv input.ex{font-weight:700}
.mv input.w{text-align:center}
.mv input:focus{border-color:var(--lime);outline:0}
.mv.hd>div{font-size:11px;color:var(--mut);text-align:center}
.mv.hd>div:nth-child(2){text-align:left;padding-left:4px}
.mv .icon{width:26px}
.sug{display:flex;flex-direction:column;background:#1F1F1F;border-radius:12px;overflow:hidden}
.sug:empty{display:none}
.sug button{display:flex;justify-content:space-between;background:none;border:0;border-top:1px solid #2a2a2a;padding:11px 14px;font-size:15px;color:var(--ink);text-align:left}
.sug button:first-child{border-top:0}
.sug small{color:var(--mut);font-size:12px}
.ins{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;background:none;border:0;padding:0;width:100%}
.ins::before,.ins::after{content:"";flex:1;border-top:1px dashed #3a3a3a}
.ins b{color:var(--lime);border:1px dashed var(--lime);border-radius:99px;padding:3px 10px}
.addex{border:1px dashed #3a3a3a;border-radius:12px;padding:10px;color:var(--mut);font-size:15px;background:none;text-align:left}
.note{font-size:12px;color:var(--lime);text-align:center}
.secres{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#262f0a;border-radius:10px;padding:6px 8px 6px 12px;font-size:13px;color:var(--lime);font-weight:700}
.secres input{background:#000;border:1px solid #3d4a12;border-radius:8px;padding:5px 8px;width:110px;font-family:var(--num);font-weight:800;font-size:20px;color:var(--lime);text-align:right}
.mini-p{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;border:1px solid var(--lime);color:var(--lime);background:none}
.mini-p.on{background:var(--lime);color:#000}
.groupbar{position:sticky;bottom:12px;display:flex;gap:8px;align-items:center;background:#1F1F1F;border:1px solid #333;border-radius:18px;padding:10px 12px;z-index:5}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid #555;background:none;display:inline-grid;place-items:center;flex:none;font-size:14px;font-weight:800;color:#000;padding:0}
.ck.on{background:var(--lime);border-color:var(--lime)}
.card.picked{outline:2px solid var(--lime)}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt button{border:1px solid #333;border-radius:12px;padding:10px 6px;font-size:14px;background:none;color:var(--ink)}
.opt button span{color:var(--mut);font-size:12px}
.opt button.on{background:var(--lime);color:#000;border-color:var(--lime);font-weight:700}
.opt button.on span{color:#333}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
</style>
</head><body>


<div class="app" id="app">
  <main class="screen" id="screen"></main>
  <nav class="tabs" id="tabs" aria-label="메뉴">
    <button class="tab" data-tab="cal"><i></i>캘린더</button>
    <button class="tab" data-tab="wod"><i></i>와드</button>
    <button class="tab" data-tab="lib"><i></i>운동목록</button>
    <button class="tab" data-tab="stats"><i></i>돌아보기</button>
  </nav>
  <div class="sheet-wrap" id="sheetWrap" hidden>
    <button class="scrim" data-action="close-sheet" aria-label="닫기"></button>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="guide" id="guide" role="dialog" aria-modal="true" aria-label="사용 예시" hidden></div>
</div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const norm = x => String(x || '').toLowerCase().replace(/\s+/g, '');
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = ['일','월','화','수','목','금','토'];
const TODAY = () => ymd(new Date());
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); return addDays(x, -((x.getDay()+6)%7)); };
const secToMs = s => { s = Math.round(s); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const msToSec = t => { if (!t) return NaN; const p = String(t).split(':').map(Number); return p.length === 2 ? p[0]*60+p[1] : p[0]*60; };
const round25 = x => Math.round(x/2.5)*2.5;
/* weights are kept in the unit they were typed in; charts and 1RM convert to the chosen unit */
const LB = 2.20462;
const U = () => state.unit || 'kg';

function migrate(st) {
  st.cats ||= DEF_CATS.map(c => ({...c}));

  if (!st.patterns || st.patterns.some(t => !t.tpl)) st.patterns = DEF_PATTERNS.map(p => ({...p}));

  st.named ||= [];

  for (const e of seedExercises()) if (['pc','hpc','pj','clean','psn','sqsn','ohs','dip','pistol','backext'].includes(e.id) && !st.exercises.some(x => x.id === e.id || x.name === e.name)) st.exercises.push(e);
  const byName = n => st.exercises.find(e => norm(e.name) === norm(n));

  for (const s of st.sessions) for (const it of s.items) if (it.type === 'wod') it.parts.forEach(p => p.moves.forEach(link));

const planContents = p => p.wodId ? (wodById(p.wodId)?.name || '') : (p.exIds || []).map(id => exById(id)?.name).filter(Boolean).join(', ');
function entriesOn(ds) {
  const s = sessionsOn(ds).map(x => ({kind:'s', id:x.id, title:x.title || '운동', cat:sessionCat(x), meta:summary(x)}));
  const p = plansOn(ds).map(x => ({kind:'p', id:x.id, title:x.title, cat:x.cat, meta:[repeatText(x), planContents(x)].filter(Boolean).join(' · ')}));
  return [...s, ...p].filter(e => !ui.hidden.includes(e.cat));
}

/* ---------- derived ---------- */
function bestSet(it) {
  let best = null;
  for (const s of it.sets) if (it.fields.includes('w') && s.w) { const v = conv(e1rm(+s.w, +s.r || 1), wuOf(it), U()); if (!best || v > best.v) best = {v, w:s.w, r:s.r || 1, u:wuOf(it)}; }
  return best;
}
function itemText(it) {
  if (it.type === 'wod') return `${it.name} ${wodResult(it)}`.trim();
  const ex = exById(it.exId) || {name:'삭제된 운동', unit:'km'};
  const b = bestSet(it);
  if (b) return `${ex.name} ${b.w}${b.u === 'lb' ? 'lb' : ''}×${b.r}`;
  const s = it.sets[0] || {};
  if (s.d) return `${ex.name} ${s.d}${ex.unit}${s.t ? ' ' + s.t : ''}`;
  if (it.fields.includes('r')) return `${ex.name} ${it.sets.length}세트`;
  return ex.name;
}
const summary = s => s.items.map(itemText).join(' · ');
const setsText = (it, ex) => it.sets.map(x => it.fields.map(k => x[k] ? `${x[k]}${k === 'd' ? ex.unit : ''}` : '').filter(Boolean).join(' × ')).filter(Boolean).join(' · ');
const resType = it => (it.parts?.length > 1 ? 'time' : it.parts?.[0]?.fmt?.res) || 'text';
function fmtRes(v, type) {
  v = String(v || '').trim(); if (!v) return '';
  if (type === 'rr') { const m = v.match(/^(\d+)\s*[+rR]\s*\+?\s*(\d+)$/); if (m) return `${m[1]}R+${m[2]}`; if (/^\d+$/.test(v)) return `${v}R`; }
  if (type === 'reps' && /^\d+$/.test(v)) return `${v}회`;
  if (type === 'weight' && /^[\d.]+$/.test(v)) return `${v}${U()}`;
  return v;
}
function wodResult(it) { const r = it.res || {};
  if (r.status === 'DNF') return `DNF${r.short ? ' -' + String(r.short).replace(/^-/, '') : ''}`;
  if (r.status === 'DONE') return r.v ? `DONE ${fmtRes(r.v, resType(it))}` : 'DONE';
  return fmtRes(r.v, resType(it)); }
const partResult = p => p.res?.status === 'DONE' ? 'DONE' : fmtRes(p.res?.v, p.fmt?.res);
const resScore = (v, type) => { v = String(v || ''); if (type === 'time') return -msToSec(v); if (type === 'rr') { const m = v.match(/^(\d+)\D*(\d+)?$/); return m ? +m[1] * 1000 + (+m[2] || 0) : NaN; } return parseFloat(v); };
function bestWod(id, exceptSessionId) {
  if (!id) return null;
  let best = null;
  for (const s of state.sessions) if (s.id !== exceptSessionId) for (const it of s.items) if (it.type === 'wod' && it.wodId === id && !it.res?.status && it.res?.v) {
    const sc = resScore(it.res.v, resType(it)); if (!isNaN(sc) && (!best || sc > best.sc)) best = {sc, txt:wodResult(it), date:s.date}; }
  return best;
}
const wodMoves = it => (it.parts || []).flatMap(p => p.moves);
const tplSummary = w => [w.parts.map(p => [p.fmt.label, patLabel(p.pat)].filter(Boolean).join(' ')).join(' → '), wodMoves(w).map(m => m.n).filter(Boolean).join(', ')].filter(Boolean).join(' · ');
function series(exId) {
  const pts = [];
  for (const s of sorted()) { let b = 0; for (const it of s.items) if (it.type === 'ex' && it.exId === exId) for (const x of it.sets) b = Math.max(b, conv(e1rm(+x.w, +x.r), wuOf(it), U())); if (b) pts.push({date:s.date, v:Math.round(b*10)/10}); }
  return pts;
}
function weekStats() {
  const days = new Set(state.sessions.map(s => s.date)), mon = mondayOf(new Date());
  const cnt = start => { let c = 0; for (let i = 0; i < 7; i++) if (days.has(ymd(addDays(start, i)))) c++; return c; };
  const count = cnt(mon);
  let streak = 0; for (let w = 1; w < 80; w++) { if (cnt(addDays(mon, -7*w)) >= state.goal) streak++; else break; }
  if (count >= state.goal) streak++;
  return {count, streak};
}
function planKeepRate() {
  let due = 0, kept = 0; const today = new Date();
  for (let i = 1; i <= 28; i++) { const ds = ymd(addDays(today, -i));
    for (const p of state.plans) if (planOn(p, ds)) { due++; if (sessionsOn(ds).some(s => s.planId === p.id)) kept++; } }
  return {due, kept, rate:due ? Math.round(kept / due * 100) : 0};
}
function prevSetsFor(exId, beforeDate) {
  for (const s of [...state.sessions].sort((a,b) => b.date.localeCompare(a.date))) {
    if (beforeDate && s.date > beforeDate) continue;
    const it = s.items.find(i => i.type === 'ex' && i.exId === exId); if (it) return Object.assign(it.sets.map(x => ({...x})), {wu:wuOf(it)});
  }
  return null;
}

/* ---------- render ---------- */

}

        <div class="row between sub"><span>최고 세트 ${hero.w}${hero.u} × ${hero.r}</span><span>${prevBest ? `이전 최고 ${Math.round(prevBest*10)/10}${U()}` : '첫 기록'}</span></div></button>`; }
    const wodHero = s.items.filter(i => i.type === 'wod').map(it => { const b = bestWod(it.wodId, s.id), multi = it.parts.length > 1, p0 = it.parts[0];

  }).join('<div style="height:8px;border-top:1px solid var(--line)"></div>')}</div>`;

/* editor */
function newDraft(date, plan) {
  const d = {id:null, date, duration:'', title:plan?.title || '', mood:'', memo:'', place:'', items:[], planId:plan?.id || null};
  if (plan) { for (const id of plan.exIds || []) if (exById(id)) d.items.push(exItem(id, date)); if (plan.wodId && wodById(plan.wodId)) d.items.push(wodItem(wodById(plan.wodId))); }
  return d;
}

/* exercise history */
function hits(id, name) {
  const out = [], q = norm(name);
  for (const s of [...state.sessions].sort((a, b) => b.date.localeCompare(a.date))) for (const it of s.items) {
    if (it.type === 'ex') { const ex = exById(it.exId);
      if ((id && it.exId === id) || (!id && q && ex && norm(ex.name).includes(q))) out.push({s, kind:'ex', head:ex?.name || '', detail:setsText(it, ex || {unit:'km'}) + (it.fields.includes('w') ? ' ' + wuOf(it) : '')}); }
    else { const ms = it.parts.flatMap(p => p.moves.filter(m => id ? (m.exId === id || (!m.exId && q && norm(m.n).includes(q))) : (q && norm(m.n).includes(q))).map(m => ({...m, q:m.q || schemeOf(p.pat)})));
      if (ms.length) out.push({s, kind:'wod', head:`${it.name}${wodResult(it) ? ' · ' + wodResult(it) : ''}`, detail:ms.map(m => [qTxt(m.q), m.n, m.w].filter(Boolean).join(' ')).join(', ')}); }
  }
  return out;
}
const hitRow = h => `<button class="it" data-action="open-day" data-date="${h.s.date}"><span class="bar" style="background:${h.kind === 'wod' ? 'var(--orange)' : catOf(sessionCat(h.s)).color};height:30px"></span><span class="grow"><span class="t" style="display:block">${esc(h.head)}</span><span class="meta" style="display:block">${esc(h.detail)}</span></span><span class="n" style="font-size:20px;color:var(--mut)">${md(h.s.date)}</span></button>`;

function chartSvg(pts) {
  const W = 340, H = 170, L = 30, R = 40, T = 12, B = 22, vs = pts.map(p => p.v);
  let lo = Math.floor((Math.min(...vs) - 2) / 10) * 10, hi = Math.ceil((Math.max(...vs) + 2) / 10) * 10;
  const step = hi - lo <= 40 ? 10 : 20;
  const t0 = parseYmd(pts[0].date).getTime(), t1 = parseYmd(pts[pts.length-1].date).getTime();
  const x = d => L + (parseYmd(d).getTime() - t0) / Math.max(1, t1 - t0) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = ''; for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2a2a2a"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end" fill="#8C8C8C" font-size="10">${v}</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.date).toFixed(1)},${y(p.v).toFixed(1)}`).join(''), lp = pts[pts.length-1];
  const lab = [pts[0], pts[Math.floor(pts.length/2)], lp].map((p, i) => `<text x="${x(p.date)}" y="${H-5}" text-anchor="${['start','middle','end'][i]}" fill="#8C8C8C" font-size="10">${md(p.date)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="예상 1RM ${pts[0].v}${U()}에서 ${lp.v}${U()}">${g}<path d="${line}L${x(lp.date)},${H-B}L${L},${H-B}Z" fill="#C8F031" opacity=".12"/><path d="${line}" fill="none" stroke="#C8F031" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(lp.date)}" cy="${y(lp.v)}" r="5" fill="#C8F031"/><text x="${x(lp.date)+8}" y="${y(lp.v)+4}" fill="#F2F2F2" font-size="13" font-weight="700">${lp.v}</text>${lab}</svg>`;
}

    const dates = [...new Set(sorted().map(s => s.date))], i = dates.indexOf(ui.dayDate), to = dates[i + (dx < 0 ? 1 : -1)];
    if (to) { swallowClick = true; ui.dayDate = to; render(); }
  }
  press = null;
});
document.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; });
document.addEventListener('contextmenu', e => { if (e.target.closest('#cal,#recBtn,[data-lp]')) e.preventDefault(); });

document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; e.preventDefault(); return; }

  const dc = e.target.closest('[data-date]:not([data-action])');

    if (lastTap.ds === ds && now - lastTap.t < 350) { lastTap = {ds:null, t:0}; if (ds > TODAY()) openPlan(newPlanDraft(ds)); else openEditor(newDraft(ds)); return; }
    lastTap = {ds, t:now}; ui.sel = ds; if (!ds.startsWith(ui.month)) ui.month = ds.slice(0, 7); render(true); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const a = el.dataset.action;
  if (ui.confirm && !['del-session','cancel-edit','del-plan','del-wod','del-ex','reset','wipe','fe-del','fr-reset','cat-del'].includes(a)) ui.confirm = null;
  A[a]?.(el);
});
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (ds.d) { ui.draft[ds.d] = t.value; if (ds.d === 'date') { if (!t.value) ui.draft.date = TODAY(); else if (t.value > TODAY()) { ui.draft.date = TODAY(); toast('기록은 오늘까지 쓸 수 있어요'); } render(true); } return; }
  if (ds.f && ds.s !== undefined) { ui.draft.items[+ds.i].sets[+ds.s][ds.f] = t.value; return; }
  if (ds.mv !== undefined) { const m = curItems()[+ds.i].parts[+ds.pi].moves[+ds.mv]; m[ds.k] = t.value; if (ds.k === 'n') { m.exId = null; showSug(t, ds); } return; }
  if (ds.patv !== undefined) { const p = curItems()[+ds.i].parts[+ds.patv]; p.pat.v = t.value.trim(); const sc = schemeOf(p.pat); document.querySelectorAll(`input.q[data-i="${ds.i}"][data-pi="${ds.patv}"]`).forEach(q => q.placeholder = sc || '10'); return; }

  if (ds.pres !== undefined) { const p = curItems()[+ds.i].parts[+ds.pres]; p.res = {...(p.res || {}), v:t.value}; return; }
  if (ds.res) { const it = curItems()[+ds.i]; it.res = {...(it.res || {}), [ds.res]:t.value}; const pv = document.querySelector(`[data-respv="${ds.i}"]`); if (pv) pv.textContent = wodResult(it) || '-'; return; }
  if (ds.tn) { ui.tdraft.note = t.value; return; }
  if (ds.fe) { ui.fe[ds.fe] = t.value; return; }
  if (ds.ce) { ui.ce[ds.ce] = t.value; return; }
  if (ds.p) { ui.pdraft[ds.p] = t.value; if (ds.p === 'start') { if (!t.value) ui.pdraft.start = TODAY(); if (ui.pdraft.repeat === 'weekly' && ui.pdraft.days.length <= 1) ui.pdraft.days = [parseYmd(ui.pdraft.start).getDay()]; } if (ds.p !== 'title') render(true); return; }
  if (ds.e) { ui.exd[ds.e] = t.value; return; }
  if (t.id === 'libQ') { ui.libQ = t.value; $('#libList').innerHTML = libList(); return; }
  if (t.id === 'pickQ') { ui.pickQ = t.value; $('#pickList').innerHTML = pickList(); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  e.target.files[0].text().then(txt => { const d = JSON.parse(txt), s = d.state || d;
    if (!Array.isArray(s.sessions) || !Array.isArray(s.exercises) || !Array.isArray(s.plans)) throw new Error('bad');
    state = migrate({mine:[], goal:4, ...s}); save(); render(); toast(`기록 ${state.sessions.length}개를 불러왔어요`);
  }).catch(() => toast('이 파일은 불러올 수 없어요'));
});
document.addEventListener('change', e => { const k = e.target.dataset.catf; if (k) { ui.hidden = e.target.checked ? ui.hidden.filter(x => x !== k) : [...new Set([...ui.hidden, k])]; render(true); } });
/* weight changed from a loaded WOD's Rx weight → mark Scaled */
document.addEventListener('change', e => { const ds = e.target.dataset; if (ds.mv === undefined || ds.k !== 'w') return;
  const it = curItems()[+ds.i]; if (ui.page === 'tpl' || !it.wodId) return;
  const changed = wodMoves(it).some(m => m.rx !== undefined && m.rx !== '' && norm(m.w) !== norm(m.rx));
  const want = changed ? 'Scaled' : 'Rx'; if (it.scale !== want) { it.scale = want; render(true); toast(changed ? 'Rx 무게와 달라서 Scaled로 바꿨어요' : 'Rx로 바꿨어요'); } });
/* exercise suggestions under the name field; only the list is redrawn so Korean typing is not interrupted */
function showSug(input, ds) {

  const q = norm(input.value); if (!q) { box.innerHTML = ''; return; }
  const u = usage(), list = state.exercises.filter(e => norm(e.name).includes(q)).sort((a, b) => (u[b.id] || 0) - (u[a.id] || 0)).slice(0, 5);
  const exact = list.some(e => norm(e.name) === q);
  box.innerHTML = list.map(e => `<button data-action="mv-pick" data-i="${ds.i}" data-pi="${ds.pi}" data-j="${ds.mv}" data-id="${e.id}"><b>${esc(e.name)}</b><small>${u[e.id] ? `${u[e.id]}번` : ''}</small></button>`).join('')
    + (exact ? '' : `<button data-action="mv-new" data-i="${ds.i}" data-pi="${ds.pi}" data-j="${ds.mv}" style="color:var(--lime)">+ "${esc(input.value.trim())}" 새 운동으로</button>`);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); });

/* ---------- no zooming: block pinch (iOS ignores user-scalable=no); double-tap zoom is off via touch-action ---------- */
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* ---------- edge swipe back: drag from the left edge to the right, like iPhone Safari ---------- */
const EDGE = 28;
function goBack() {
  if (!$('#sheetWrap').hidden) { closeSheet(); return; }
  if (ui.page === 'edit') { const was = ui.confirm; A['cancel-edit'](); if (ui.page === 'edit' && ui.confirm === 'cancel' && was !== 'cancel') toast('한 번 더 밀면 작성 중인 내용을 버려요'); return; }
  if (ui.page === 'tpl') A['tpl-cancel'](); else if (ui.page) A['close-page']();
}
let edge = null;
document.addEventListener('touchstart', e => {
  const t = e.touches[0], left = $('#app').getBoundingClientRect().left;
  edge = (e.touches.length === 1 && $('#guide').hidden && t.clientX - left < EDGE && (ui.page || !$('#sheetWrap').hidden)) ? {x:t.clientX, y:t.clientY, t:Date.now(), on:false, el:!$('#sheetWrap').hidden ? $('#sheet') : $('#screen')} : null;
}, {passive:true});
document.addEventListener('touchmove', e => {
  if (!edge) return;
  const t = e.touches[0], dx = t.clientX - edge.x, dy = t.clientY - edge.y;
  if (!edge.on) { if (Math.abs(dy) > 10 && Math.abs(dy) > dx) { edge = null; return; } if (dx < 8) return; edge.on = true; edge.el.style.transition = 'none'; edge.el.style.boxShadow = '-12px 0 24px rgba(0,0,0,.6)'; document.activeElement?.blur?.(); }
  e.preventDefault();
  edge.dx = Math.max(0, dx); edge.el.style.transform = `translateX(${edge.dx}px)`;
}, {passive:false});
function endEdge() {
  if (!edge) return; const g = edge; edge = null; if (!g.on) return;
  swallowClick = true; setTimeout(() => swallowClick = false, 350);
  const w = $('#app').clientWidth, go = g.dx > w * 0.33 || (g.dx > 40 && g.dx / (Date.now() - g.t) > 0.5);
  g.el.style.transition = 'transform .18s ease-out'; g.el.style.transform = `translateX(${go ? w : 0}px)`;
  setTimeout(() => { g.el.style.transition = g.el.style.transform = g.el.style.boxShadow = ''; if (go) goBack(); }, 190);
}
document.addEventListener('touchend', endEdge);
document.addEventListener('touchcancel', endEdge);

render();
try { if (!localStorage.getItem(GUIDE_KEY) && !/[?&]noguide/.test(location.search)) showGuide(); } catch (e) {}
</script>
