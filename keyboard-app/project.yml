name: AIKeyboard
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # 다른 사람과 겹치지 않게 본인 것으로 바꾸세요 (예: com.yourname.aikeyboard)
    BUNDLE_PREFIX: com.example.aikeyboard
    SHARED_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_PREFIX).shared
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AIKeyboard:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: TranslateKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AI 번역 키보드
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SharedKeychainGroup: $(SHARED_KEYCHAIN_GROUP)
    entitlements:
      path: App/AIKeyboard.entitlements
      properties:
        keychain-access-groups: [$(SHARED_KEYCHAIN_GROUP)]
  TranslateKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: AI 번역
        SharedKeychainGroup: $(SHARED_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ko-KR
            # 번역 API를 호출하려면 "전체 접근 허용"이 필요해요
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/TranslateKeyboard.entitlements
      properties:
        keychain-access-groups: [$(SHARED_KEYCHAIN_GROUP)]
